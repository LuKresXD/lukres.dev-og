<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set piece · The Terrain</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@600&f[]=satoshi@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #090a0d; color: #f1f2f4; font-family: "Satoshi", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; }
  .frame { max-width: 1400px; margin: 0 auto; padding: 26px clamp(20px, 3.5vw, 64px); height: 100%; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; font-size: 13px; color: #8a8c92; position: relative; z-index: 2; }
  header b { color: #f1f2f4; font-weight: 500; }
  .stage { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .word { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font-family: "Switzer", sans-serif; font-weight: 600; font-size: clamp(3rem, 10vw, 9rem); letter-spacing: -0.04em; z-index: 2; }
  .cap { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8c92; padding-bottom: 8px; text-align: center; position: relative; z-index: 2; }
</style>
</head>
<body>
<div class="frame">
  <header><span><b>LuKres</b> — Chicago</span><span>The Terrain</span></header>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="word">LuKres</div>
  </div>
  <p class="cap">A dot-wave ocean under every page — swells with scroll velocity, parts around the cursor, calms when you rest</p>
  <script>
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = cv.width = cv.offsetWidth * 2;
    const H = cv.height = cv.offsetHeight * 2;
    const horizon = H * 0.52;
    for (let row = 0; row < 26; row++) {
      const z = row / 25;
      const y0 = horizon + Math.pow(z, 1.6) * (H - horizon) * 0.95;
      const n = 90;
      for (let i = 0; i <= n; i++) {
        const x = (i / n) * W;
        const wave = Math.sin(i * 0.22 + row * 0.9) * 14 * (0.3 + z) +
                     Math.sin(i * 0.06 + row * 0.35) * 26 * z;
        const y = y0 + wave;
        const a = 0.08 + z * 0.5;
        const r = 1 + z * 2.2;
        ctx.fillStyle = `rgba(150, 168, 205, ${a.toFixed(2)})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      }
    }
  </script>
</div>
</body>
</html>
